name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The repo doesn't ship the Gradle wrapper jar, so install Gradle directly.
      # Once you commit gradlew + gradle/wrapper/gradle-wrapper.jar, drop gradle-version
      # and run ./gradlew instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.1

      - name: Unit tests
        run: gradle :starflow:testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: starflow/build/reports/tests/